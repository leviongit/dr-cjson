name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  CC: clang
  LIBNAME: cjson

jobs:
  compile-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # - windows-latest
          # - macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: kfischer-okarin/download-dragonruby@v1
        with:
          license_tier: pro
      - name: Compile
        run: |
          ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.LIBNAME }}-${{ runner.os }}
          path: build/native/**/*
